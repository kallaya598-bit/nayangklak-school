<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replay Button</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10151f;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: min(100%, 360px);
      padding: 16px;
    }
    button {
      width: 100%;
      min-height: 82px;
      border: 0;
      border-radius: 14px;
      background: #d71920;
      color: white;
      font-size: 26px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(215, 25, 32, .35);
    }
    button:active { transform: translateY(1px); }
    button:disabled {
      cursor: wait;
      opacity: .7;
    }
    .status {
      margin-top: 12px;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #1f2937;
      color: #dbeafe;
      font-size: 16px;
      line-height: 1.35;
      text-align: center;
    }
    .ok { color: #86efac; }
    .warn { color: #fde68a; }
    .bad { color: #fca5a5; }
  </style>
</head>
<body>
  <main class="panel">
    <button id="replayBtn" type="button">REPLAY</button>
    <div id="status" class="status">พร้อมใช้งาน</div>
  </main>

  <script>
    const OBS_URL = 'ws://127.0.0.1:4455';
    const LIVE_SCENE = 'Scene';
    const REPLAY_SCENE = 'Replay 7s Slow';
    const TRANSITION_SCENE = 'Replay Transition';
    const RETURN_TRANSITION_SCENE = 'Live Transition';
    const REPLAY_INPUT = 'Replay 7s Slow Media';
    const REPLAY_SECONDS = 7;
    const SPEED_PERCENT = 60;
    const RETURN_EXTRA_MS = 0;
    const TRANSITION_MS = 1200;
    const FADE_MS = 220;
    const OUTPUTS_SUBSCRIPTION = 64;
    const MEDIA_INPUTS_SUBSCRIPTION = 256;

    const button = document.getElementById('replayBtn');
    const statusBox = document.getElementById('status');
    let ws;
    let requestId = 1;
    const pending = new Map();

    function setStatus(text, tone) {
      statusBox.className = 'status ' + (tone || '');
      statusBox.textContent = text;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function connect() {
      if (ws && ws.readyState === WebSocket.OPEN) return Promise.resolve();
      setStatus('กำลังเชื่อมต่อ OBS...', 'warn');
      return new Promise((resolve, reject) => {
        ws = new WebSocket(OBS_URL);
        const timer = setTimeout(() => reject(new Error('เชื่อมต่อ OBS ไม่ได้')), 5000);

        ws.onerror = () => reject(new Error('เชื่อมต่อ OBS ไม่ได้'));
        ws.onmessage = event => {
          const message = JSON.parse(event.data);

          if (message.op === 0) {
            ws.send(JSON.stringify({
              op: 1,
              d: { rpcVersion: 1, eventSubscriptions: OUTPUTS_SUBSCRIPTION | MEDIA_INPUTS_SUBSCRIPTION }
            }));
          }

          if (message.op === 2) {
            clearTimeout(timer);
            resolve();
          }

          if (message.op === 5 && message.d.eventType === 'ReplayBufferSaved') {
            const waiter = pending.get('ReplayBufferSaved');
            if (waiter) {
              pending.delete('ReplayBufferSaved');
              waiter.resolve(message.d.eventData.savedReplayPath);
            }
          }

          if (message.op === 5 && message.d.eventType === 'MediaInputPlaybackEnded') {
            const inputName = message.d.eventData && message.d.eventData.inputName;
            const waiter = pending.get('ReplayEnded');
            if (waiter && inputName === REPLAY_INPUT) {
              pending.delete('ReplayEnded');
              waiter.resolve();
            }
          }

          if (message.op === 7) {
            const waiter = pending.get(message.d.requestId);
            if (!waiter) return;
            pending.delete(message.d.requestId);
            if (message.d.requestStatus.result) {
              waiter.resolve(message.d.responseData || {});
            } else {
              waiter.reject(new Error(message.d.requestStatus.comment || 'OBS ทำคำสั่งไม่สำเร็จ'));
            }
          }
        };
      });
    }

    function request(type, data = {}) {
      const id = String(requestId++);
      ws.send(JSON.stringify({ op: 6, d: { requestType: type, requestId: id, requestData: data } }));
      return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
    }

    function waitForReplayPath() {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          pending.delete('ReplayBufferSaved');
          reject(new Error('ไม่พบไฟล์รีเพลใหม่'));
        }, 10000);
        pending.set('ReplayBufferSaved', {
          resolve: path => {
            clearTimeout(timer);
            resolve(path);
          },
          reject
        });
      });
    }

    function waitForReplayEnd(fallbackMs) {
      return new Promise(resolve => {
        const timer = setTimeout(() => {
          pending.delete('ReplayEnded');
          resolve();
        }, fallbackMs);
        pending.set('ReplayEnded', {
          resolve: () => {
            clearTimeout(timer);
            resolve();
          }
        });
      });
    }

    async function playReplay() {
      button.disabled = true;
      try {
        await connect();
        const rb = await request('GetReplayBufferStatus');
        if (!rb.outputActive) {
          setStatus('เริ่มระบบรีเพล...', 'warn');
          await request('StartReplayBuffer');
          await sleep(1000);
        }

        setStatus('กำลังบันทึกรีเพล...', 'warn');
        const replayPathPromise = waitForReplayPath();
        await request('SaveReplayBuffer');
        const replayPath = await replayPathPromise;

        setStatus('กำลังเล่นรีเพล...', 'ok');
        await request('SetInputSettings', {
          inputName: REPLAY_INPUT,
          inputSettings: {
            is_local_file: true,
            local_file: replayPath,
            looping: false,
            restart_on_activate: true,
            close_when_inactive: true,
            clear_on_media_end: true,
            speed_percent: SPEED_PERCENT
          },
          overlay: true
        });
        await request('SetCurrentSceneTransition', { transitionName: 'Fade' }).catch(() => {});
        await request('SetCurrentSceneTransitionDuration', { transitionDuration: FADE_MS }).catch(() => {});
        await request('SetCurrentProgramScene', { sceneName: TRANSITION_SCENE });
        await sleep(TRANSITION_MS);
        await request('SetCurrentSceneTransition', { transitionName: 'Fade' }).catch(() => {});
        await request('SetCurrentSceneTransitionDuration', { transitionDuration: FADE_MS }).catch(() => {});
        await request('SetCurrentProgramScene', { sceneName: REPLAY_SCENE });

        const playbackMs = Math.ceil((REPLAY_SECONDS * 1000 * 100) / SPEED_PERCENT) + RETURN_EXTRA_MS;
        await waitForReplayEnd(playbackMs);
        await request('SetCurrentSceneTransition', { transitionName: 'Fade' }).catch(() => {});
        await request('SetCurrentSceneTransitionDuration', { transitionDuration: FADE_MS }).catch(() => {});
        await request('SetCurrentProgramScene', { sceneName: RETURN_TRANSITION_SCENE });
        await sleep(TRANSITION_MS);
        await request('SetCurrentSceneTransition', { transitionName: 'Fade' }).catch(() => {});
        await request('SetCurrentSceneTransitionDuration', { transitionDuration: FADE_MS }).catch(() => {});
        await request('SetCurrentProgramScene', { sceneName: LIVE_SCENE });
        setStatus('พร้อมใช้งาน', 'ok');
      } catch (error) {
        setStatus(error.message, 'bad');
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener('click', playReplay);
    connect().then(() => setStatus('พร้อมใช้งาน', 'ok')).catch(error => setStatus(error.message, 'bad'));
  </script>
</body>
</html>
