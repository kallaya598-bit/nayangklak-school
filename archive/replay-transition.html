<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replay Transition</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }
    .wipe {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.12), transparent 28%),
        linear-gradient(115deg, rgba(0,0,0,.92), rgba(12,22,38,.98) 42%, rgba(215,25,32,.96) 50%, rgba(12,22,38,.98) 58%, rgba(0,0,0,.92));
      opacity: 0;
      transform: scale(1.08);
      animation: stage 1200ms cubic-bezier(.18,.82,.24,1) forwards;
    }
    .flash {
      position: fixed;
      inset: 0;
      background: linear-gradient(95deg, transparent 20%, rgba(255,255,255,.65), transparent 80%);
      transform: translateX(-120%);
      animation: flash 850ms 180ms cubic-bezier(.2,.78,.22,1) forwards;
    }
    .label {
      color: white;
      font-size: 124px;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 8px 32px rgba(0,0,0,.55);
      transform: translateY(18px) scale(.94);
      opacity: 0;
      animation: pop 720ms 160ms cubic-bezier(.18,.9,.22,1) forwards;
    }
    .line {
      position: fixed;
      left: 0;
      right: 0;
      height: 6px;
      background: #ffffff;
      box-shadow: 0 0 28px rgba(255,255,255,.9);
      opacity: 0;
    }
    .top { top: 18%; transform: translateX(-55%); animation: lineIn 760ms 170ms ease-out forwards; }
    .bottom { bottom: 18%; transform: translateX(55%); animation: lineOut 760ms 170ms ease-out forwards; }
    @keyframes stage {
      0% { opacity: 0; transform: scale(1.08); filter: blur(10px); }
      22% { opacity: 1; transform: scale(1.02); filter: blur(0); }
      74% { opacity: 1; transform: scale(1); filter: blur(0); }
      100% { opacity: .98; transform: scale(1.015); filter: blur(0); }
    }
    @keyframes flash {
      to { transform: translateX(120%); }
    }
    @keyframes pop {
      0% { opacity: 0; transform: translateY(18px) scale(.94); }
      55% { opacity: 1; transform: translateY(0) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes lineIn {
      to { opacity: .95; transform: translateX(0); }
    }
    @keyframes lineOut {
      to { opacity: .95; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="wipe">
    <div class="line top"></div>
    <div class="label" id="label">REPLAY</div>
    <div class="line bottom"></div>
    <div class="flash"></div>
  </div>
  <script>
    const text = new URLSearchParams(location.search).get('label') || 'REPLAY';
    document.getElementById('label').textContent = text.toUpperCase();
  </script>
</body>
</html>
